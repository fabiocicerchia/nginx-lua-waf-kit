# Benchmark server. One location per scenario, so a single nginx process serves
# both the baseline and the module-enabled paths — same build, same hardware,
# same upstream, and the only variable is the Lua in the request path.
#
# The upstream is a static 200 from nginx itself: the point is to measure what
# the modules add, not what an application costs.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx-bench.pid;

events { worker_connections 4096; }

http {
    access_log off;
    lua_shared_dict waf_ratelimit 10m;
    lua_shared_dict waf_jwks 1m;
    lua_package_path "/kit/lua/?.lua;;";

    init_by_lua_block {
        waf = {
            ratelimit = require "ratelimit",
            bots      = require "bot_heuristics",
            geo       = require "geo_asn",
            mirror    = require "mirror",
        }
    }

    server {
        listen 8080 reuseport;

        # 0. baseline: no Lua at all.
        location /baseline {
            return 200 "ok";
        }

        # 1. one module at a time.
        location /ratelimit {
            access_by_lua_block {
                -- A rate high enough that nothing is rejected: we are measuring
                -- the cost of deciding, not the cost of a 429.
                waf.ratelimit.limit({ algo = "token-bucket", capacity = 1e9, rate = 1e9 })
            }
            return 200 "ok";
        }

        location /ratelimit-log {
            access_by_lua_block {
                waf.ratelimit.limit({ algo = "sliding-log", capacity = 1000, window = 1 })
            }
            return 200 "ok";
        }

        location /bots {
            access_by_lua_block { waf.bots.score({ log_only = true }) }
            return 200 "ok";
        }

        location /geo {
            access_by_lua_block {
                waf.geo.check(nil, { deny_countries = { "XX" }, allow_cidrs = { "10.0.0.0/8" } })
            }
            return 200 "ok";
        }

        location /mirror {
            set $dc_mirror 0;
            access_by_lua_block { waf.mirror.decide({ sample_rate = 0.01, kill_file = "" }) }
            return 200 "ok";
        }

        # 2. everything on, which is what an adopter will actually run.
        location /all {
            set $dc_mirror 0;
            access_by_lua_block {
                waf.geo.check(nil, { deny_countries = { "XX" } })
                waf.ratelimit.limit({ algo = "token-bucket", capacity = 1e9, rate = 1e9 })
                waf.bots.score({ log_only = true })
                waf.mirror.decide({ sample_rate = 0.01, kill_file = "" })
            }
            return 200 "ok";
        }
    }
}
