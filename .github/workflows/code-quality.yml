name: code-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Lint the GitHub Actions workflows themselves.
      - name: actionlint
        uses: raven-actions/actionlint@v2

      # Enforce .editorconfig (indentation, EOL, trailing whitespace).
      - name: editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@v2

      # Catch common typos in code and docs.
      - name: typos
        uses: crate-ci/typos@master

      # pre-commit runs the language-specific hooks defined in
      # .pre-commit-config.yaml. It no-ops gracefully if none apply.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: pre-commit
        uses: pre-commit/action@v3.0.1

  # The kit's logic is pure Lua, so the suite runs on any 5.1+ interpreter —
  # no nginx, no resty, no container needed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1
      - name: Run the test suite
        run: lua5.1 test/run.lua
