version: 2
updates:
  # Keep GitHub Actions pinned versions fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Everything else rides in one pull request rather than one each.
      actions:
        patterns: ["*"]

  # Uncomment and set the ecosystem for your project's dependencies.
  # ecosystems: npm, pip, gomod, cargo, bundler, maven, composer, nuget, ...
  # - package-ecosystem: npm
  #   directory: /
  #   schedule:
  #     interval: weekly
