# All five modules, enforcing nothing.
#
# This is the first deployment. Every module scores, decides and writes down
# what it WOULD have done, and every request goes through. That is not a
# cautious default, it is the only honest one: a bot heuristic tuned on
# somebody else's traffic will reject your customers, and the way you find that
# out is by reading a week of logs rather than by reading a support queue.
#
#   docker compose up -d
#   # send it real traffic, or mirror some
#   ./analyse.sh                # per-module rates, from the logs
#
# There is exactly one thing to get wrong here, and it is on purpose: nothing
# in this file sets log_only = false. Turning enforcement on is an edit to one
# module at a time, after its rate is a number you believe.

lua_shared_dict waf_ratelimit 10m;
lua_shared_dict waf_jwks      1m;
lua_shared_dict waf_kill      12k;

lua_package_path "/kit/lua/?.lua;;";

init_by_lua_block {
  waf = {
    ratelimit = require "ratelimit",
    bots      = require "bot_heuristics",
    jwt       = require "jwt",
    geo       = require "geo_asn",
    mirror    = require "mirror",
  }
}

# WARN, because that is the level every "would reject" line is written at.
# Raising this to error loses the entire point of the rollout; lowering it to
# info buries it under OpenResty's own chatter.
error_log /var/log/nginx/waf.log warn;

# The rates come out of the ACCESS log, not the error log: an error-log line
# says a module scored something, and only the access log says how many
# requests there were to score. A rate needs both.
log_format waf escape=json
  '{"t":"$time_iso8601","status":$status,"ua":"$http_user_agent",'
  '"bot_score":"$bot_score","geo":"$geo_reason","rt":$request_time}';

server {
    listen 8080;
    server_name _;

    set $dc_mirror 0;
    set $bot_score '-';
    set $geo_reason '-';

    access_log /var/log/nginx/access.log waf;

    access_by_lua_block {
      -- Same order as examples/waf.conf.example: cheapest first, so a request
      -- that a denied country would have stopped does not pay for the rest.
      -- The order still matters under log_only, because the whole point is to
      -- measure what the enforcing configuration would cost.

      -- 1. geo/ASN. Needs ngx_http_geoip2_module and a .mmdb; without them
      --    every request reads as unknown, which is a valid log_only answer.
      waf.geo.check(nil, {
        deny_countries = { "KP" },
        log_only       = true,
      })

      -- 2. rate limit. Deliberately a limit somebody might actually set, not
      --    one nothing reaches: a rollout that logs zero would-rejects has
      --    measured nothing.
      waf.ratelimit.limit({
        algo     = "token-bucket",
        dict     = "waf_ratelimit",
        capacity = 60,
        rate     = 1,
        window   = 60,
        log_only = true,
      })

      -- 3. bot heuristics. The module most likely to be wrong about real
      --    traffic, and the reason this whole directory exists.
      waf.bots.score({
        threshold = 0.6,
        log_only  = true,
      })

      -- 4. JWT. log_only was added for this: an enforcing JWT module against
      --    real traffic rejects every client whose token shape nobody checked,
      --    and those are your own users.
      waf.jwt.require_token({
        secret   = os.getenv("WAF_JWT_SECRET") or "not-a-real-secret-log-only",
        log_only = true,
      })

      -- 5. mirror. Non-enforcing by construction — it only decides whether to
      --    duplicate a request — so there is no log_only to set. Sampling at
      --    1% bounds what it costs a shared datastore.
      waf.mirror.decide({
        sample_rate = 0.01,
        reads_only  = true,
        kill_dict   = "waf_kill",
      })

      -- Carried into the access log line, so a rate can be computed per
      -- request rather than per error-log entry.
      ngx.var.bot_score = tostring(ngx.ctx.bot_score or "-")
      ngx.var.geo_reason = tostring(ngx.ctx.geo_reason or "-")
    }

    location / {
        return 200 "ok\n";
    }
}
