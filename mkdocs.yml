site_name: nginx-lua-waf-kit
site_description: >-
  Opt-in Lua modules for the nginx-lua image: rate limiting, bot scoring,
  edge JWT, geo/ASN policy and request mirroring.
repo_url: https://github.com/fabiocicerchia/nginx-lua-waf-kit
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: README.md
  - Architecture: architecture.md
  - Getting Started: getting-started.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
